name: personal_sender
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.14.0

dependencies:
  basic_utils: 5.8.2
  crypto: 3.0.8
  file_picker: 13.4.1
  flutter:
    sdk: flutter
  flutter_secure_storage: 11.2.0
  logging: 1.3.0
  material_ui: ^1.1.0
  mobile_scanner: 7.5.0
  network_info_plus: 8.2.2
  qr_flutter: 4.1.0
  shared_preferences: 2.5.6
  shelf: 1.4.3
  shelf_router: 1.1.5
  uuid: 4.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  # Bundled fonts (no runtime fetching). Both are SIL Open Font Licence; the
  # licence texts sit next to the files in assets/fonts/.
  fonts:
    - family: Archivo
      fonts:
        - asset: assets/fonts/Archivo.ttf
    - family: RobotoMono
      fonts:
        - asset: assets/fonts/RobotoMono.ttf
